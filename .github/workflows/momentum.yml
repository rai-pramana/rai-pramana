name: Refresh momentum chart

# 勢い · Momentum is drawn from the real contribution calendar, so it drifts a
# little every day. Rebuild it from the API and commit only when the numbers
# actually moved -- build_momentum.py embeds the totals in the SVG and the README
# alt text, so a silent stale chart would be a quiet lie.

on:
  schedule:
    - cron: "17 19 * * *" # 03:17 WITA, after the 3D graph at 02:00
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: momentum
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    name: rebuild momentum chart
    steps:
      - uses: actions/checkout@v5

      - name: Fetch contribution calendar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/fetch_contrib.py

      - name: Rebuild the chart
        run: python3 tools/build_momentum.py

      # GitHub keeps recalculating historical days (measured: 2026-09-13 23->22,
      # 09-26 113->112, 09-27 90->91 in one day) with the TOTAL unchanged, so
      # tools/data/contrib.json moves on every single run even when the drawing is
      # identical. Committing that raw churn would bump ?v=N daily for a chart that
      # did not change, and every bump invalidates the camo cache for nothing.
      # So: decide from the RENDERED OUTPUT, never from the JSON.
      - name: Sync README alt text and cache-bust
        id: sync
        run: |
          if git diff --quiet -- assets/; then
            echo "chart unchanged (only GitHub's historical recalc moved)"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            git checkout -- tools/data/contrib.json
            exit 0
          fi
          echo "chart changed -> syncing alt text and cache-busters"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          python3 - <<'PY'
          import re, sys
          sys.path.insert(0, "tools")
          import build_momentum as bm

          alt = bm.alt_text(bm.load_series())
          p = "README.md"
          s = open(p).read()
          new, n = re.subn(r'(momentum-dark\.svg\?v=\d+" width="100%" alt=")[^"]*(")',
                           lambda m: m.group(1) + alt + m.group(2), s)
          if n != 1:
            sys.exit(f"FAIL: expected 1 momentum img, patched {n}")
          new, bump = re.subn(r'(momentum-(?:dark|light)\.svg)\?v=(\d+)',
                              lambda m: f"{m.group(1)}?v={int(m.group(2)) + 1}", new)
          open(p, "w").write(new)
          print(f"alt synced, {bump} cache-busters bumped: {alt}")
          PY

      - name: Commit & push if the chart moved
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .
          if git diff --cached --quiet; then
            echo "no change in contribution data"
            exit 0
          fi
          git commit -m "chore: refresh momentum chart"
          # The 3D job can commit at 02:00 and snake at 08:00, so the branch may
          # have moved since checkout. Rebase rather than fail the run.
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push; then
              echo "pushed"
              exit 0
            fi
            echo "push attempt $attempt failed, retrying"
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "could not push after 3 attempts"
          exit 1