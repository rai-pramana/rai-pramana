name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *" # 08:00 WITA
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: rai-pramana
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#8A6428&color_dots=#eaeef2,#e0d3bb,#c9b48d,#a8895c,#8a6a2f
            dist/snake-dark.svg?palette=github-dark&color_snake=#B08D57&color_dots=#1f2430,#4a3f2c,#6f5c3c,#8f7550,#b08d57

      - name: Push SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
