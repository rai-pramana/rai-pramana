name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *" # 08:00 WITA
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: rai-pramana
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#E60012&color_dots=#ebedf0,#ffd7d7,#ff9d9d,#ff5c5c,#E60012
            dist/snake-dark.svg?palette=github-dark&color_snake=#F7C948&color_dots=#1f2430,#7d1f2a,#b32333,#E60012,#F7C948

      - name: Push SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
