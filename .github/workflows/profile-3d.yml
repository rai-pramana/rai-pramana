name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 18 * * *" # 02:00 WITA
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v5
      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: profile-3d-settings.json

      # The action paints the top-language legend from GitHub's own language
      # colours, hardcoded upstream — settings.json cannot reach them. Those are
      # the only saturated fills left in the graph, so remap them here.
      - name: Calm the language legend
        run: |
          python3 - <<'PY'
          import re, pathlib

          MAP = {
              "#F7523F": "#B08D57",   # python -> muted gold
              "#3572A5": "#87683A",   # blue   -> muted copper
              "#3178C6": "#B08D57",   # ts     -> muted gold
              "#DA5B0B": "#87683A",   # orange -> muted copper
              "#444444": "#353A47",   # grey   -> border slate
              "#C1121F": "#87683A",   # stray light red -> copper
              "#E60012": "#B08D57",   # stray bright red -> gold
          }

          for f in ("profile-custom.svg", "profile-custom-light.svg"):
              p = pathlib.Path(f)
              if not p.exists():
                  continue
              s = p.read_text()
              n = 0
              for old, new in MAP.items():
                  s, k = re.subn(re.escape(old), new, s, flags=re.I)
                  n += k
              p.write_text(s)
              print(f"{f}: remapped {n} fill(s)")
          PY

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .
          if git commit -m "chore: regenerate 3D contribution graph"; then
            git push
          fi
