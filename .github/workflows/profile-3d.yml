name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 18 * * *" # 02:00 WITA
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v5
      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: profile-3d-settings.json

      # The action always emits a language pie + legend in the lower-left. That
      # duplicates the 技術 · Stack card, and it counts "Jupyter Notebook", which
      # the language card skips on purpose (notebooks commit base64 PNG output).
      # Drop the pie and put a colour key for the 3D bars in its place -- the bars
      # use five shades with nothing explaining them.
      #
      # This also retires an earlier step that remapped GitHub's own language
      # colours (#F7523F python, #3572A5 blue, ...). Those fills lived only in the
      # pie; contribColors come from settings.json, so after the strip there is
      # nothing left to remap (verified: 0 matches).
      - name: Replace the language pie with a bar colour key
        run: python3 tools/patch_3d.py

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .
          if git diff --cached --quiet; then
            echo "no change in the 3D graph"
            exit 0
          fi
          git commit -m "chore: regenerate 3D contribution graph"
          # Other jobs land commits on this branch (snake at 08:00, momentum at
          # 03:17), so the branch can move between checkout and push.
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push; then
              echo "pushed"
              exit 0
            fi
            echo "push attempt $attempt failed, retrying"
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "could not push after 3 attempts"
          exit 1
